name: Test Suite

on:
  push:
    branches: [main]

jobs:
  run-tests:
    name: Execute bats-core tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Make CLI script executable
        run: chmod +x ./todo.sh

      - name: Install bats-core
        run: npm install bats

      - name: Run all tests
        env:
          BATS_LIB_PATH: ${{ github.workspace }}/test/test_helper
        run: ./node_modules/.bin/bats test/
