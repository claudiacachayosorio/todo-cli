name: Bash CLI Testing

on:
  push:
    branches: [main]

jobs:
  testing:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Make script executable
        run: chmod +x ./todo

      - name: Install Bats
        run: npm install -g bats

      - name: Run Bats tests
        env:
          BATS_LIB_PATH: ${{ github.workspace }}/test/test_helper
        run: bats test/
